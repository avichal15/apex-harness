appId: com.avichal.apexharness
productName: ApexHarness
artifactName: ApexHarness-${version}-${arch}.${ext}

extraMetadata:
  main: electron/apex-main.mjs
  name: apex-harness
  productName: ApexHarness
  description: "Apex Harness — Unified Multi-Agent AI Software Engineering IDE, Live Agent Office, and Cross-IDE Harness Substrate"

directories:
  buildResources: build
  output: release-apex

asar: false
npmRebuild: false

files:
  - electron/apex-main.mjs
  - electron/apex-preload.cjs
  - server/**
  - "!server/**/*.node-test.mjs"
  - "!server/**/*.test.ts"
  - shared/**
  - ui/**
  - skills/**
  - harness2/**
  - package.json
  - LICENSE
  - NOTICE
  - "!**/node_modules/**"

extraResources:
  - from: LICENSE
    to: licenses/OpenMausBot-LICENSE.txt
  - from: NOTICE
    to: licenses/OpenMausBot-NOTICE.txt

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  shortcutName: ApexHarness

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: build/icon.png
  category: Development
  synopsis: "Unified Multi-Agent AI Software Engineering IDE"
